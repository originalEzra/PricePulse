spring:
  application:
    name: price-pulse
  profiles:
    default: standalone
  jackson:
    time-zone: UTC
  threads:
    virtual:
      enabled: false
  data:
    redis:
      repositories:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:18080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

price-pulse:
  monitoring:
    # Enable only after the additive migration and coordinated rollout; V8 clients stay compatible.
    enabled: ${PRICEPULSE_MONITORING_ENABLED:false}
    dynamic-subscriptions-enabled: ${PRICEPULSE_DYNAMIC_SUBSCRIPTIONS_ENABLED:false}
    adopt-legacy-holds: ${PRICEPULSE_ADOPT_LEGACY_HOLDS:false}
  alpaca:
    enabled: ${PRICEPULSE_ALPACA_ENABLED:false}
    # Read-only by default; local operators explicitly opt in after reviewing the write scope.
    business-writes-enabled: ${PRICEPULSE_ALPACA_BUSINESS_WRITES_ENABLED:false}
    key-id: ${APCA_API_KEY_ID:}
    secret-key: ${APCA_API_SECRET_KEY:}
    environment: ${APCA_API_ENV:paper}
    symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, ORCL, SMCI, SOFI, AMD, TSLA, CRWD, MU, INTC, BA, HOOD]
    queue-capacity: 1024
  assistant:
    enabled: ${PRICEPULSE_AI_ENABLED:false}
    base-url: ${PRICEPULSE_AI_BASE_URL:https://api.groq.com/openai}
    api-key: ${PRICEPULSE_AI_API_KEY:}
    model: ${PRICEPULSE_AI_MODEL:openai/gpt-oss-20b}
    connect-timeout: PT10S
    read-timeout: PT45S
  messaging:
    enabled: false
    topic: price-pulse-alert-triggered
    consumer-group: price-pulse-notification-consumer
    batch-size: 50
    max-batches-per-run: 4
    max-attempts: 8
    lease-duration: PT30S
    initial-backoff: PT2S
    max-backoff: PT2M
    publisher-initial-delay-ms: 1000
    publisher-fixed-delay-ms: 1000
  market:
    live-max-age: PT2M
    max-future-skew: PT30S
  security:
    jwt:
      issuer: price-pulse
      access-token-ttl: PT2H
      secret: ${JWT_SECRET}
