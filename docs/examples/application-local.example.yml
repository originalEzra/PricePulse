# Public local-development template; never add personal credentials here.
spring:
  config:
    import: optional:file:.local/alpaca.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:13306/price_pulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:pricepulse}
    password: ${SPRING_DATASOURCE_PASSWORD:pricepulse_local}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:16379}
  flyway:
    locations: classpath:db/migration,classpath:db/local
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:127.0.0.1:19876}
  producer:
    group: price-pulse-outbox-producer
price-pulse:
  messaging:
    enabled: ${PRICEPULSE_MESSAGING_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET}
