name: price-pulse-phase0

services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: price_pulse
      MYSQL_USER: pricepulse
      MYSQL_PASSWORD: ${DB_PASSWORD:-pricepulse_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pricepulse_root_local}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D price_pulse -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.6-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  namesrv:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "127.0.0.1:19876:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    command: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store

  broker:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqbroker", "-n", "namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m"
    depends_on:
      namesrv:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10909:10909"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
