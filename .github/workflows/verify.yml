name: PricePulse verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Verification only. No deployment, database credentials, environment, or write permissions.
permissions:
  contents: read

concurrency:
  group: pricepulse-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend isolated regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Australia/Sydney
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and isolated MySQL / Redis / RocketMQ regression
        run: bash scripts/run-real-pipeline-checks.sh
      - name: Report-tool unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend and read-only probe tests
        run: |
          node --experimental-strip-types --test frontend/tests/*.test.ts
          node --test scripts/tests/*.test.mjs
      - run: npm run type-check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
