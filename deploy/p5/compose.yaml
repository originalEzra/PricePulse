services:
  namesrv:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports: ["127.0.0.1:39876:9876"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 2s
      timeout: 3s
      retries: 40
  broker:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqbroker", "-n", "namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m"
    depends_on:
      namesrv: { condition: service_healthy }
    ports: ["127.0.0.1:38111:38111", "127.0.0.1:38109:38109"]
    volumes: ["./broker.conf:/home/rocketmq/conf/broker.conf:ro"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/38111'"]
      interval: 2s
      timeout: 3s
      retries: 40
